<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alura · Servidores</title>
<style>
  :root {
    --bg: #0c0e0d; --field: #0f1211; --side: #101312; --card: #161918; --card-2: #1d2120; --line: #232826;
    --text: #f2f5f3; --muted: #8f9a95; --accent: #2dff7a; --accent-soft: rgba(45,255,122,.12);
    --on-accent: #04130a; --online: #3ddc84; --away: #f5c451; --dnd: #ff6b6b; --off: #555d59;
    color-scheme: dark;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 240px minmax(0,1fr); height: 100vh; }

  /* Lateral */
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .logo { height: 64px; display: flex; align-items: center; padding: 0 20px; }
  .logo svg { width: 34px; height: 34px; }
  .nav { padding: 4px 12px; display: grid; gap: 2px; }
  .nav a { position: relative; display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-weight: 500; transition: background .15s, color .15s; }
  .nav a:hover { background: var(--card-2); color: var(--text); }
  .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--text); }
  .nav a[aria-current="page"] svg { color: var(--accent); }
  .nav a[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav .gap { height: 12px; }
  .side h3 { margin: 20px 24px 8px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .side h3 button { color: var(--muted); display: grid; }
  .srv { display: flex; align-items: center; gap: 10px; margin: 0 12px; padding: 6px 12px; border-radius: 8px; }
  .srv:hover { background: var(--card-2); }
  .srv b { font-weight: 600; display: block; } .srv small { color: var(--muted); font-size: 12px; }
  .me { margin-top: auto; padding: 10px 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .me .who { flex: 1; min-width: 0; line-height: 1.25; } .me .who b { display: block; } .me .who small { color: var(--muted); font-size: 12px; }
  .me button { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
  .me button:hover, .icon-btn:hover { background: var(--card-2); color: var(--text); }
  .me svg.i { width: 18px; height: 18px; }

  .av { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 13px; background: #243029; color: var(--accent); }
  .av.sq { border-radius: 12px; }
  .av .st { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--side); background: var(--online); box-sizing: content-box; }
  .av .st.dnd { background: var(--dnd); }

  /* Topo */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { height: 64px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .search { flex: 1; max-width: 520px; position: relative; }
  .search svg { position: absolute; left: 12px; top: 10px; width: 18px; height: 18px; color: var(--muted); }
  .search input { width: 100%; height: 38px; border: 0; border-radius: 8px; background: var(--card); padding: 0 44px 0 38px; }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: 2px solid var(--accent); background: var(--card-2); }
  .search kbd { position: absolute; right: 10px; top: 8px; font: 600 11px/20px inherit; color: var(--muted); background: var(--card-2); border-radius: 4px; padding: 0 7px; }
  .sp { flex: 1; }
  .icon-btn { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }

  /* Servidores */
  .page { flex: 1; overflow-y: auto; padding: 32px 24px 48px; }
  .col { max-width: 1000px; margin: 0 auto; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .head h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -.02em; }
  .head p { margin: 0; color: var(--muted); }
  .btn { height: 38px; padding: 0 16px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: filter .15s; }
  .btn:hover { filter: brightness(.92); }
  .btn svg { width: 16px; height: 16px; stroke-width: 2.4; }

  .find { position: relative; margin-bottom: 16px; }
  .find svg { position: absolute; left: 14px; top: 13px; width: 18px; height: 18px; color: var(--muted); }
  .find input { width: 100%; height: 44px; border: 0; border-radius: 10px; background: var(--card); padding: 0 16px 0 42px; }
  .find input::placeholder { color: var(--muted); }
  .find input:focus { outline: 2px solid var(--accent); background: var(--card-2); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
  .tab { position: relative; height: 40px; padding: 0 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab small { font-size: 12px; background: var(--card-2); color: var(--muted); border-radius: 10px; padding: 0 7px; line-height: 18px; }
  .tab[aria-selected="true"] { color: var(--text); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }

  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .cat { height: 32px; padding: 0 14px; border-radius: 16px; background: var(--card); color: var(--muted); font-weight: 600; font-size: 13px; transition: background .15s, color .15s; }
  .cat:hover { background: var(--card-2); color: var(--text); }
  .cat[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .sv { background: var(--card); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; transition: background .15s; }
  .sv:hover { background: var(--card-2); }
  .sv .top2 { display: flex; align-items: center; gap: 12px; }
  .sv .ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 20px; font-weight: 700; background: #243029; color: var(--accent); flex: none; }
  .sv .nm { flex: 1; min-width: 0; line-height: 1.3; }
  .sv .nm b { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; }
  .sv .nm b svg { width: 14px; height: 14px; color: var(--accent); }
  .sv .nm small { color: var(--muted); font-size: 13px; }
  .pin { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); opacity: 0; transition: opacity .15s; }
  .sv:hover .pin, .sv:focus-within .pin, .pin[aria-pressed="true"] { opacity: 1; }
  .pin[aria-pressed="true"] { color: var(--accent); }
  .pin:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .pin svg { width: 17px; height: 17px; }
  .sv p { margin: 0; color: var(--muted); line-height: 1.45; min-height: 20px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: 12px; color: var(--muted); background: rgba(255,255,255,.05); border-radius: 6px; padding: 2px 8px; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 4px; }
  .foot .m { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .foot .m svg { width: 16px; height: 16px; }
  .go { height: 32px; padding: 0 16px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; }
  .go:hover { background: var(--accent); color: var(--on-accent); }
  .go.open { background: var(--card-2); color: var(--text); font-weight: 600; }
  .sv:hover .go.open { background: #2a302e; } .go.open:hover { background: #333a37; color: var(--text); }

  .empty { text-align: center; color: var(--muted); padding: 64px 16px; }
  .empty svg { width: 36px; height: 36px; margin-bottom: 10px; opacity: .6; }
  .empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  @media (max-width: 700px) { .app { grid-template-columns: 1fr; } .side { display: none; } .head { flex-direction: column; } .page { padding: 16px; } .pin { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g1" x1="15%" y1="85%" x2="65%" y2="15%"><stop offset="0" stop-color="#00DFA0"/><stop offset=".4" stop-color="#39FF88"/><stop offset="1" stop-color="#7EFFBD"/></linearGradient>
    <linearGradient id="g2" x1="35%" y1="15%" x2="85%" y2="85%"><stop offset="0" stop-color="#00DFA0"/><stop offset=".45" stop-color="#00B377"/><stop offset="1" stop-color="#004B1F"/></linearGradient>
    <linearGradient id="g3" x1="50%" y1="45%" x2="50%" y2="90%"><stop offset="0" stop-color="#007A40"/><stop offset=".5" stop-color="#003516"/><stop offset="1" stop-color="#001609"/></linearGradient>
    <symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
    <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5M16 4.5a3.5 3.5 0 010 7M18 14.8c2 .6 3.3 2.3 3.6 5"/></symbol>
    <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.6-4 3.7-6 8-6s7.4 2 8 6"/></symbol>
    <symbol id="uplus" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3.2-5.5 6.5-5.5s6 2 6.5 5.5M19 8v6M16 11h6"/></symbol>
    <symbol id="chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0112 0v6l2 2H4zM10 21h4"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></symbol>
    <symbol id="head" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0116 0v3M4 15h4v5H5a1 1 0 01-1-1zM20 15h-4v5h3a1 1 0 001-1z"/></symbol>
    <symbol id="pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3zM12 14v7"/></symbol>
    <symbol id="crown" viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside class="side">
    <div class="logo" aria-label="Alura">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <path d="M26 73C34 60 41 53 50 53C59 53 66 60 74 73C66 64 58 59 50 59C42 59 34 64 26 73Z" fill="url(#g3)"/>
        <path d="M50 14C55 14 59 18 61 22L83 67C87 75 80 83 73 81C69 80 66 77 64 72L51 44C50 42 49 32 50 14Z" fill="url(#g2)"/>
        <path d="M50 14C44 14 40 18 38 22L17 67C13 75 20 83 27 81C31 80 34 77 36 72L49 44C51 40 52 30 55 22C54 16 52 14 50 14Z" fill="url(#g1)"/>
      </svg>
    </div>
    <nav class="nav" aria-label="Principal">
      <a href="#"><svg class="i"><use href="#home"/></svg>Início</a>
      <a href="#"><svg class="i"><use href="#users"/></svg>Amigos</a>
      <a href="#"><svg class="i"><use href="#user"/></svg>Perfil</a>
      <a href="#"><svg class="i"><use href="#uplus"/></svg>Solicitações</a>
      <a href="#"><svg class="i"><use href="#chat"/></svg>Mensagens</a>
      <div class="gap"></div>
      <a href="#" aria-current="page"><svg class="i"><use href="#server"/></svg>Servidores</a>
      <a href="#"><svg class="i"><use href="#gear"/></svg>Configurações</a>
    </nav>
    <h3>Seus servidores <button aria-label="Criar servidor"><svg class="i" style="width:16px;height:16px"><use href="#plus"/></svg></button></h3>
    <a class="srv" href="#"><span class="av sq">T</span><div><b>Teste</b><small>1 online</small></div></a>
    <div class="me">
      <span class="av">C<i class="st dnd"></i></span>
      <div class="who"><b>Continha</b><small>Não perturbe</small></div>
      <button aria-label="Microfone"><svg class="i"><use href="#mic"/></svg></button>
      <button aria-label="Fones"><svg class="i"><use href="#head"/></svg></button>
      <button aria-label="Ajustes"><svg class="i"><use href="#gear"/></svg></button>
    </div>
  </aside>

  <section class="main">
    <header class="top">
      <label class="search"><svg class="i"><use href="#search"/></svg><input type="search" placeholder="Buscar amigos, usuários, servidores"><kbd>/</kbd></label>
      <span class="sp"></span>
      <button class="icon-btn" aria-label="Notificações"><svg class="i"><use href="#bell"/></svg></button>
    </header>

    <div class="page">
      <div class="col">
        <div class="head">
          <div>
            <h1>Servidores</h1>
            <p>Descubra comunidades, converse com outros membros e compartilhe suas paixões.</p>
          </div>
          <button class="btn" id="create"><svg class="i"><use href="#plus"/></svg>Criar servidor</button>
        </div>

        <label class="find"><svg class="i"><use href="#search"/></svg><input id="q" type="search" placeholder="Buscar servidores por nome, assunto ou tag"></label>

        <div class="tabs" role="tablist" id="tabs">
          <button class="tab" role="tab" aria-selected="true" data-t="all">Descobrir <small id="n-all">0</small></button>
          <button class="tab" role="tab" aria-selected="false" data-t="mine">Meus servidores <small id="n-mine">0</small></button>
          <button class="tab" role="tab" aria-selected="false" data-t="member">Que eu participo <small id="n-member">0</small></button>
        </div>

        <div class="cats" id="cats"></div>
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden>
          <svg class="i"><use href="#server"/></svg>
          <b>Nenhum servidor encontrado</b>
          <span>Tente outra busca ou categoria.</span>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
  // Troque pelos servidores reais do seu app
  const servers = [
    { id: 1, name: 'Teste',       cat: 'Jogos', desc: 'teste', tags: ['comunidade','alura','react'], members: 4, owner: true,  member: true,  pinned: true  },
    { id: 2, name: '!JAQUEZINHA', cat: 'Jogos', desc: 'aham',  tags: ['comunidade','alura'],         members: 5, owner: false, member: false, pinned: false }
  ];
  const categories = ['Todos','Jogos','Tecnologia','Estudos','Criatividade','Entretenimento','Música','Comunidade'];
  let tab = 'all', cat = 'Todos', query = '';
  const $ = id => document.getElementById(id);
  const pinSvg = '<svg class="i"><use href="#pin"/></svg>', crown = '<svg class="i"><use href="#crown"/></svg>', usr = '<svg class="i"><use href="#users"/></svg>';

  // categorias
  categories.forEach(c => {
    const b = document.createElement('button'); b.className = 'cat'; b.textContent = c; b.setAttribute('aria-pressed', c === cat);
    b.onclick = () => { cat = c; document.querySelectorAll('.cat').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
    $('cats').appendChild(b);
  });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    tab = t.dataset.t; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t)); render();
  }));
  $('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); render(); });
  $('create').addEventListener('click', () => { /* TODO: abrir seu fluxo de criar servidor */ });

  function render() {
    $('n-all').textContent = servers.length;
    $('n-mine').textContent = servers.filter(s => s.owner).length;
    $('n-member').textContent = servers.filter(s => s.member).length;

    const list = servers.filter(s =>
      (tab === 'all' || (tab === 'mine' && s.owner) || (tab === 'member' && s.member)) &&
      (cat === 'Todos' || s.cat === cat) &&
      (!query || (s.name + ' ' + s.desc + ' ' + s.tags.join(' ')).toLowerCase().includes(query))
    ).sort((a, b) => b.pinned - a.pinned);

    const grid = $('grid'); grid.innerHTML = '';
    list.forEach(s => {
      const el = document.createElement('article'); el.className = 'sv';
      el.innerHTML =
        '<div class="top2"><div class="ic"></div><div class="nm"><b></b><small></small></div>' +
        '<button class="pin" aria-label="Fixar servidor"></button></div>' +
        '<p></p><div class="tags"></div>' +
        '<div class="foot"><span class="m"></span><button class="go"></button></div>';
      el.querySelector('.ic').textContent = s.name.replace(/[^\p{L}\p{N}]/gu, '')[0].toUpperCase();
      el.querySelector('b').innerHTML = ''; el.querySelector('b').append(s.name);
      if (s.owner) el.querySelector('b').insertAdjacentHTML('beforeend', crown);
      el.querySelector('small').textContent = s.cat;
      el.querySelector('p').textContent = s.desc;
      s.tags.forEach(t => { const x = document.createElement('span'); x.textContent = '#' + t; el.querySelector('.tags').appendChild(x); });
      el.querySelector('.m').innerHTML = usr; el.querySelector('.m').append(s.members + ' membros');
      const pin = el.querySelector('.pin'); pin.innerHTML = pinSvg; pin.setAttribute('aria-pressed', s.pinned);
      pin.setAttribute('aria-label', s.pinned ? 'Desafixar servidor' : 'Fixar servidor');
      pin.onclick = () => { s.pinned = !s.pinned; render(); };
      const go = el.querySelector('.go');
      go.textContent = s.member ? 'Abrir' : 'Entrar'; go.classList.toggle('open', s.member);
      go.onclick = () => { if (!s.member) { s.member = true; s.members++; render(); } /* TODO: abrir/entrar no servidor */ };
      grid.appendChild(el);
    });
    $('empty').hidden = list.length > 0;
  }
  render();
</script>
</body>
</html>
