<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alura</title>
<style>
  :root {
    --bg: #0c0e0d;        /* fundo do app */
    --field: #0f1211;     /* campos de entrada */
    --side: #101312;      /* lateral */
    --card: #161918;      /* janela/cards */
    --card-2: #1d2120;    /* trilhas/hover */
    --line: #232826;      /* divisórias e bordas */

    --text: #f2f5f3;      /* principal */
    --muted: #8f9a95;     /* secundário */

    --accent: #2dff7a;                    /* verde da marca */
    --accent-2: #00dfa0;                  /* degradê */
    --accent-soft: rgba(45,255,122,.12);
    --on-accent: #04130a;
    --online: #3ddc84;
    --away: #f5c451;
    --dnd: #ff6b6b;
    --off: #555d59;

    /* Aliases locais compatíveis */
    --page: var(--bg);
    --win: var(--card);
    --track: var(--card-2);

    color-scheme: dark;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--page); display: grid; place-items: center; overflow: hidden; }

  /* Janela quadradinha: 300 × 360. Na janela real ela preenche tudo. */
  .win {
    position: relative; width: min(300px, 100vw); height: min(360px, 100vh);
    background: var(--win); border-radius: 12px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 0 36px 84px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 24px 60px rgba(0,0,0,.6);
  }
  .win::before { content: ""; position: absolute; left: 50%; top: 40%; width: 260px; height: 260px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(45,255,122,.12), transparent 65%); animation: breathe 4.5s ease-in-out infinite; pointer-events: none; }
  @keyframes breathe { 50% { opacity: .45; } }

  .logo { position: relative; width: 104px; height: 104px; margin-bottom: 26px; animation: float 4s ease-in-out 2.4s infinite; }
  .logo img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 18px rgba(45,255,122,.25)); }
  @keyframes float { 50% { transform: translateY(-4px); } }

  h1 { position: relative; margin: 0; font-size: 14px; font-weight: 600; min-height: 20px; }
  .sub { position: relative; margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; min-height: 17px; }

  .bar { position: relative; width: 100%; margin-top: 16px; }
  .track { position: relative; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width .25s linear; }
  .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: translateX(-100%); animation: shine 1.6s linear infinite; }
  @keyframes shine { to { transform: translateX(100%); } }
  .track.indet .fill { width: 38%; transition: none; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(270%); } }
  .track.done .fill::after, .track.err .fill::after { display: none; }
  .track.err .fill { background: var(--dnd); }
  .meta { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; min-height: 15px; }
  .meta b { color: var(--text); font-weight: 600; }

  .btn { position: relative; margin-top: 16px; height: 34px; padding: 0 18px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font: inherit; font-size: 13px; font-weight: 700; border: 0; cursor: pointer; transition: filter .15s; }
  .btn:hover { filter: brightness(.92); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .btn[hidden] { display: none; }

  .tip { position: absolute; left: 24px; right: 24px; bottom: 36px; color: var(--muted); font-size: 12px; line-height: 1.45; min-height: 35px; text-align: center; transition: opacity .35s; }
  .tip.hide { opacity: 0; }
  .tip b { color: var(--accent); font-weight: 600; }
  .ver { position: absolute; bottom: 12px; left: 0; right: 0; color: var(--muted); font-size: 11px; opacity: .6; }

  @media (prefers-reduced-motion: reduce) {
    .win::before, .logo, .fill::after, .track.indet .fill { animation: none; }
    .fill { transition: none; }
  }
</style>

    <h1 id="title" aria-live="polite">Verificando atualizações...</h1>
    <p class="sub" id="sub"></p>
    <div class="bar">
      <div class="track indet" id="track" role="progressbar" aria-label="Progresso da atualização" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="fill"></div></div>
      <div class="meta"><span id="left"></span><span id="right"></span></div>
    </div>
    <button class="btn" id="action" hidden></button>
    <div class="tip" id="tip"></div>
    <div class="ver">v<span id="ver"></span></div>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const TOTAL_MB = 29.8;           // TODO: tamanho real da atualização
  const NEW_VERSION = '2.1.0';     // TODO: versão real
  $('ver').textContent = NEW_VERSION;

  // Dicas rotativas (troque o texto à vontade; use <b> para destacar)
  const tips = [
    'Pressione <b>/</b> para buscar amigos, usuários e servidores.',
    'Mude seu status no menu do avatar para avisar quando estiver ocupado.',
    'Personalize o banner e as cores em <b>Configurações</b>.',
    'Passe o mouse sobre uma mensagem para reagir ou responder.',
    'Conecte o <b>Spotify</b> para mostrar o que você está ouvindo.'
  ];
  let tipI = Math.floor(Math.random() * tips.length);
  const tipEl = $('tip');
  tipEl.innerHTML = tips[tipI];
  setInterval(() => {
    tipEl.classList.add('hide');
    setTimeout(() => { tipI = (tipI + 1) % tips.length; tipEl.innerHTML = tips[tipI]; tipEl.classList.remove('hide'); }, 350);
  }, 5000);

  const track = $('track'), fill = $('fill');
  const fmt = n => n.toFixed(1).replace('.', ',');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let timer;

  function set(title, sub, mode) {
    $('title').textContent = title; $('sub').textContent = sub || '';
    track.className = 'track ' + (mode || ''); fill.style.width = '';
    if (mode === 'indet') track.removeAttribute('aria-valuenow');
    $('left').textContent = $('right').textContent = '';
  }
  function progress(p) {
    fill.style.width = p + '%'; track.setAttribute('aria-valuenow', Math.round(p));
    $('left').innerHTML = '<b>' + Math.round(p) + '%</b>';
    $('right').textContent = fmt(TOTAL_MB * p / 100) + ' / ' + fmt(TOTAL_MB) + ' MB';
  }

  async function run() {
    $('action').hidden = true;
    set('Verificando atualizações...', '', 'indet');
    await wait(1600);
    if (!navigator.onLine) return fail();

    // TODO: troque esta simulação pelo progresso real do download, chamando progress(percentual)
    set('Baixando atualização...', '', '');
    let p = 0; progress(0);
    await new Promise(res => {
      timer = setInterval(() => {
        p = Math.min(100, p + (p < 70 ? 2.2 + Math.random() * 2.5 : 0.8 + Math.random() * 1.6));
        progress(p); if (p >= 100) { clearInterval(timer); res(); }
      }, 160);
    });
    await wait(500);

    set('Instalando...', '', 'indet');
    await wait(2200);

    set('Tudo pronto!', 'Atualizada para a versão ' + NEW_VERSION, 'done');
    fill.style.width = '100%'; track.setAttribute('aria-valuenow', 100);
    const b = $('action'); b.textContent = 'Abrir Alura'; b.hidden = false; b.onclick = () => { /* TODO: abrir o app */ }; b.focus();
  }

  function fail() {
    set('Sem conexão', 'Verifique sua internet.', 'err'); fill.style.width = '100%';
    const b = $('action'); b.textContent = 'Tentar novamente'; b.hidden = false; b.onclick = run;
  }
  window.addEventListener('offline', () => { if (track.classList.contains('err')) return; clearInterval(timer); fail(); });
  window.addEventListener('online', () => { if (track.classList.contains('err')) run(); });
  run();
</script>
