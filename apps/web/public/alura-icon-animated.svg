<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="alura-left-arm" x1="15%" y1="85%" x2="65%" y2="15%">
      <stop offset="0%" stop-color="#00DFA0" />
      <stop offset="40%" stop-color="#39FF88" />
      <stop offset="100%" stop-color="#7EFFBD" />
    </linearGradient>

    <linearGradient id="alura-right-arm" x1="35%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00DFA0" />
      <stop offset="45%" stop-color="#00B377" />
      <stop offset="100%" stop-color="#004B1F" />
    </linearGradient>

    <linearGradient id="alura-under-arch" x1="50%" y1="45%" x2="50%" y2="90%">
      <stop offset="0%" stop-color="#007A40" />
      <stop offset="45%" stop-color="#003516" />
      <stop offset="100%" stop-color="#001609" />
    </linearGradient>

    <linearGradient id="alura-crest-glow" x1="20%" y1="70%" x2="80%" y2="70%">
      <stop offset="0%" stop-color="#00DFA0" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#39FF88" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00DFA0" stop-opacity="0.15" />
    </linearGradient>

    <filter id="alura-fold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="2" stdDeviation="1.5" flood-color="#001B0B" flood-opacity="0.6" />
    </filter>

    <!-- Máscaras de revelação: cada parte é "desenhada" do topo para baixo -->
    <clipPath id="reveal-left">
      <rect x="0" y="0" width="100" height="0">
        <animate attributeName="height" from="0" to="100" begin="0.15s" dur="0.8s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1" />
      </rect>
    </clipPath>
    <clipPath id="reveal-right">
      <rect x="0" y="0" width="100" height="0">
        <animate attributeName="height" from="0" to="100" begin="0.35s" dur="0.8s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1" />
      </rect>
    </clipPath>
    <!-- O arco se abre a partir do centro -->
    <clipPath id="reveal-arch">
      <rect x="50" y="0" width="0" height="100">
        <animate attributeName="x" from="50" to="20" begin="0.9s" dur="0.6s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1" />
        <animate attributeName="width" from="0" to="60" begin="0.9s" dur="0.6s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.22 0.61 0.36 1" />
      </rect>
    </clipPath>
  </defs>

  <!-- Todo o ícone dá uma leve "respirada" ao entrar -->
  <g style="transform-origin: 50px 50px">
    <animateTransform attributeName="transform" type="scale" values="0.92;1.03;1" keyTimes="0;0.7;1"
                      begin="0s" dur="1.6s" fill="freeze" calcMode="spline"
                      keySplines="0.22 0.61 0.36 1;0.4 0 0.2 1" additive="replace" />

    <!-- 1. Arco inferior -->
    <g clip-path="url(#reveal-arch)">
      <path
        d="M 26,73
           C 34,60 41,53 50,53
           C 59,53 66,60 74,73
           C 66,64 58,59 50,59
           C 42,59 34,64 26,73 Z"
        fill="url(#alura-under-arch)"
      />
      <path
        d="M 28,73
           C 35,61 42,54 50,54
           C 58,54 65,61 72,73
           C 65,65 57,60 50,60
           C 43,60 35,65 28,73 Z"
        fill="url(#alura-crest-glow)"
      >
        <!-- Brilho que pulsa uma vez ao fim -->
        <animate attributeName="opacity" values="1;0.35;1" begin="1.5s" dur="0.9s" calcMode="spline"
                 keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" />
      </path>
    </g>

    <!-- 2. Braço direito -->
    <g clip-path="url(#reveal-right)">
      <path
        d="M 50,14
           C 55,14 59,18 61,22
           L 83,67
           C 87,75 80,83 73,81
           C 69,80 66,77 64,72
           L 51,44
           C 50,42 49,32 50,14 Z"
        fill="url(#alura-right-arm)"
      />
    </g>

    <!-- 3. Braço esquerdo + topo -->
    <g clip-path="url(#reveal-left)">
      <path
        d="M 50,14
           C 44,14 40,18 38,22
           L 17,67
           C 13,75 20,83 27,81
           C 31,80 34,77 36,72
           L 49,44
           C 51,40 52,30 55,22
           C 54,16 52,14 50,14 Z"
        fill="url(#alura-left-arm)"
        filter="url(#alura-fold-shadow)"
      />
    </g>
  </g>
</svg>
