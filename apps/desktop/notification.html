<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    
    .toast-container {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px;
      background-color: #111318;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.6), 0 4px 6px -2px rgba(0, 0, 0, 0.4);
      width: calc(100% - 32px);
      height: calc(100% - 32px);
      box-sizing: border-box;
      position: relative;
      cursor: pointer;
      color: #E2E8F0;
    }
    
    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }
    
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #16181D;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #39FF88;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .status-dot {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background-color: #39FF88;
      border-radius: 50%;
      border: 2px solid #111318;
    }
    
    .content {
      flex: 1;
      min-width: 0;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    
    .username {
      font-weight: 600;
      font-size: 14px;
      color: #F8FAFC;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .time {
      font-size: 12px;
      color: #94A3B8;
    }
    
    .message {
      font-size: 14px;
      color: #CBD5E1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
    }
    
    .close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: none;
      border: none;
      color: #64748B;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all 0.2s;
    }
    
    .close-btn:hover {
      color: #F8FAFC;
      background-color: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="toast-container" id="toast">
    <div class="avatar-wrapper">
      <div class="avatar" id="avatar"></div>
      <div class="status-dot"></div>
    </div>
    <div class="content">
      <div class="header">
        <span class="username" id="username"></span>
        <span class="time" id="time"></span>
      </div>
      <div class="message" id="message"></div>
    </div>
    <button class="close-btn" id="closeBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    let notificationId = null;

    ipcRenderer.on('notification-data', (event, data) => {
      notificationId = data.id;
      
      // Update texts
      document.getElementById('username').textContent = '@' + data.username;
      document.getElementById('time').textContent = data.time || '';
      document.getElementById('message').textContent = data.message;
      
      // Update avatar
      const avatarEl = document.getElementById('avatar');
      if (data.avatar_url) {
        avatarEl.innerHTML = `<img src="${data.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" />`;
      } else {
        avatarEl.textContent = data.username.substring(0, 2);
      }
    });

    document.getElementById('closeBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (notificationId) {
        ipcRenderer.send(`close-notification-${notificationId}`);
      }
    });

    document.getElementById('toast').addEventListener('click', () => {
      if (notificationId) {
        ipcRenderer.send(`click-notification-${notificationId}`);
      }
    });
  </script>
</body>
</html>
