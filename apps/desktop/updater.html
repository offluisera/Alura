<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alura</title>
<style>
  :root {
    --bg: #0c0e0d;        /* fundo do app */
    --field: #0f1211;     /* campos de entrada */
    --side: #101312;      /* lateral */
    --card: #161918;      /* janela/cards */
    --card-2: #1d2120;    /* trilhas/hover */
    --line: #232826;      /* divisórias e bordas */

    --text: #f2f5f3;      /* principal */
    --muted: #8f9a95;     /* secundário */

    --accent: #2dff7a;                    /* verde da marca */
    --accent-2: #00dfa0;                  /* degradê */
    --accent-soft: rgba(45,255,122,.12);
    --on-accent: #04130a;
    --online: #3ddc84;
    --away: #f5c451;
    --dnd: #ff6b6b;
    --off: #555d59;

    /* Aliases locais compatíveis */
    --page: var(--bg);
    --win: var(--card);
    --track: var(--card-2);

    color-scheme: dark;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Janela: 300 × 360 */
  .win {
    -webkit-app-region: drag;
    position: relative;
    width: 300px;
    height: 360px;
    background: var(--win);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 32px 76px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 24px 60px rgba(0,0,0,.7);
  }
  .win::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 38%;
    width: 240px;
    height: 240px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(45,255,122,.15), transparent 70%);
    animation: breathe 4.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: .25; transform: translate(-50%, -50%) scale(0.95); }
    50% { opacity: .55; transform: translate(-50%, -50%) scale(1.05); }
  }

  .logo {
    position: relative;
    width: 96px;
    height: 96px;
    margin-bottom: 22px;
    animation: float 4s ease-in-out infinite;
  }
  .logo img, .logo svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 0 18px rgba(45,255,122,.3));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  h1 {
    position: relative;
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    min-height: 20px;
    color: var(--text);
  }
  .sub {
    position: relative;
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.4;
    min-height: 16px;
  }

  .bar {
    position: relative;
    width: 100%;
    margin-top: 14px;
  }
  .track {
    position: relative;
    height: 5px;
    border-radius: 9999px;
    background: var(--track);
    overflow: hidden;
  }
  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: 9999px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width .25s ease-out;
  }
  .fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    transform: translateX(-100%);
    animation: shine 1.6s linear infinite;
  }
  @keyframes shine {
    to { transform: translateX(100%); }
  }
  .track.indet .fill {
    width: 40%;
    transition: none;
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    from { transform: translateX(-100%); }
    to { transform: translateX(270%); }
  }
  .track.done .fill::after, .track.err .fill::after {
    display: none;
  }
  .track.done .fill {
    width: 100% !important;
  }
  .track.err .fill {
    background: var(--dnd);
    width: 100% !important;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    min-height: 15px;
  }
  .meta b {
    color: var(--text);
    font-weight: 600;
  }

  .btn {
    -webkit-app-region: no-drag;
    position: relative;
    margin-top: 14px;
    height: 32px;
    padding: 0 18px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--on-accent);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    border: 0;
    cursor: pointer;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(.92); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn[hidden] { display: none; }

  .tip {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 34px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.4;
    min-height: 32px;
    text-align: center;
    transition: opacity .35s;
  }
  .tip.hide { opacity: 0; }
  .tip b { color: var(--accent); font-weight: 600; }
  .ver {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    color: var(--muted);
    font-size: 10px;
    opacity: .6;
  }

  @media (prefers-reduced-motion: reduce) {
    .win::before, .logo, .fill::after, .track.indet .fill { animation: none; }
    .fill { transition: none; }
  }
</style>
</head>
<body>
  <main class="win">
    <div class="logo">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="alura-left-arm" x1="15%" y1="85%" x2="65%" y2="15%">
            <stop offset="0%" stop-color="#00DFA0" />
            <stop offset="40%" stop-color="#39FF88" />
            <stop offset="100%" stop-color="#7EFFBD" />
          </linearGradient>
          <linearGradient id="alura-right-arm" x1="35%" y1="15%" x2="85%" y2="85%">
            <stop offset="0%" stop-color="#00DFA0" />
            <stop offset="45%" stop-color="#00B377" />
            <stop offset="100%" stop-color="#004B1F" />
          </linearGradient>
          <linearGradient id="alura-under-arch" x1="50%" y1="45%" x2="50%" y2="90%">
            <stop offset="0%" stop-color="#007A40" />
            <stop offset="45%" stop-color="#003516" />
            <stop offset="100%" stop-color="#001609" />
          </linearGradient>
          <linearGradient id="alura-crest-glow" x1="20%" y1="70%" x2="80%" y2="70%">
            <stop offset="0%" stop-color="#00DFA0" stop-opacity="0.15" />
            <stop offset="50%" stop-color="#39FF88" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#00DFA0" stop-opacity="0.15" />
          </linearGradient>
          <filter id="alura-fold-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="-1" dy="2" stdDeviation="1.5" flood-color="#001B0B" flood-opacity="0.6" />
          </filter>
        </defs>
        <g style="transform-origin: 50px 50px">
          <!-- 1. Arco inferior -->
          <g>
            <path
              d="M 26,73 C 34,60 41,53 50,53 C 59,53 66,60 74,73 C 66,64 58,59 50,59 C 42,59 34,64 26,73 Z"
              fill="url(#alura-under-arch)"
            />
            <path
              d="M 28,73 C 35,61 42,54 50,54 C 58,54 65,61 72,73 C 65,65 57,60 50,60 C 43,60 35,65 28,73 Z"
              fill="url(#alura-crest-glow)"
            />
          </g>
          <!-- 2. Braço direito -->
          <g>
            <path
              d="M 50,14 C 55,14 59,18 61,22 L 83,67 C 87,75 80,83 73,81 C 69,80 66,77 64,72 L 51,44 C 50,42 49,32 50,14 Z"
              fill="url(#alura-right-arm)"
            />
          </g>
          <!-- 3. Braço esquerdo + topo -->
          <g>
            <path
              d="M 50,14 C 44,14 40,18 38,22 L 17,67 C 13,75 20,83 27,81 C 31,80 34,77 36,72 L 49,44 C 51,40 52,30 55,22 C 54,16 52,14 50,14 Z"
              fill="url(#alura-left-arm)"
              filter="url(#alura-fold-shadow)"
            />
          </g>
        </g>
      </svg>
    </div>
    <h1 id="title" aria-live="polite">Verificando atualizações...</h1>
    <p class="sub" id="sub"></p>
    <div class="bar">
      <div class="track indet" id="track" role="progressbar" aria-label="Progresso da atualização" aria-valuemin="0" aria-valuemax="100">
        <div class="fill" id="fill"></div>
      </div>
      <div class="meta"><span id="left"></span><span id="right"></span></div>
    </div>
    <button class="btn" id="action" hidden></button>
    <div class="tip" id="tip"></div>
    <div class="ver">v<span id="ver">1.0.3</span></div>
  </main>

<script>
  const $ = id => document.getElementById(id);
  const track = $('track');
  const fill = $('fill');
  const tipEl = $('tip');
  const titleEl = $('title');
  const subEl = $('sub');
  const leftEl = $('left');
  const rightEl = $('right');
  const actionBtn = $('action');
  const verEl = $('ver');

  // Dicas rotativas do Alura
  const tips = [
    'Pressione <b>/</b> para buscar amigos, usuários e servidores.',
    'Mude seu status no menu do avatar para avisar quando estiver ocupado.',
    'Personalize o banner e as cores em <b>Configurações</b>.',
    'Passe o mouse sobre uma mensagem para reagir ou responder.',
    'Conecte o <b>Spotify</b> para mostrar o que você está ouvindo.'
  ];
  let tipI = Math.floor(Math.random() * tips.length);
  tipEl.innerHTML = tips[tipI];
  setInterval(() => {
    tipEl.classList.add('hide');
    setTimeout(() => {
      tipI = (tipI + 1) % tips.length;
      tipEl.innerHTML = tips[tipI];
      tipEl.classList.remove('hide');
    }, 350);
  }, 5000);

  function setStatus(title, sub, mode) {
    titleEl.textContent = title;
    subEl.textContent = sub || '';
    track.className = 'track ' + (mode || '');
    fill.style.width = '';
    if (mode === 'indet') track.removeAttribute('aria-valuenow');
    leftEl.textContent = '';
    rightEl.textContent = '';
  }

  function setProgress(p, detail) {
    track.className = 'track';
    const cleanPct = Math.max(0, Math.min(100, Math.round(p)));
    fill.style.width = cleanPct + '%';
    track.setAttribute('aria-valuenow', cleanPct);
    leftEl.innerHTML = '<b>' + cleanPct + '%</b>';
    if (detail) {
      rightEl.textContent = detail;
    }
  }

  // Integração com Electron IPC
  let hasElectron = false;
  try {
    const { ipcRenderer } = require('electron');
    hasElectron = true;

    ipcRenderer.on('updater-status', (event, data) => {
      if (data.version && verEl) {
        verEl.textContent = data.version;
      }
      if (data.stage === 'checking') {
        actionBtn.hidden = true;
        setStatus(data.label || 'Verificando atualizações...', data.detail || '', 'indet');
      } else if (data.stage === 'downloading') {
        actionBtn.hidden = true;
        setStatus(data.label || 'Baixando atualização...', '', '');
        setProgress(data.percent || 0, data.detail);
      } else if (data.stage === 'installing') {
        actionBtn.hidden = true;
        setStatus(data.label || 'Instalando...', data.detail || '', 'indet');
      } else if (data.stage === 'ready') {
        actionBtn.hidden = true;
        setStatus(data.label || 'Tudo pronto!', data.detail || 'Iniciando o aplicativo...', 'done');
        fill.style.width = '100%';
        track.setAttribute('aria-valuenow', 100);
      } else if (data.stage === 'error') {
        setStatus('Sem conexão', data.detail || 'Verifique sua internet.', 'err');
        fill.style.width = '100%';
        actionBtn.textContent = 'Tentar novamente';
        actionBtn.hidden = false;
        actionBtn.onclick = () => {
          actionBtn.hidden = true;
          ipcRenderer.send('retry-updater');
        };
      }
    });
  } catch (e) {
    hasElectron = false;
  }

  // Fallback caso aberto fora do Electron
  if (!hasElectron) {
    const wait = ms => new Promise(r => setTimeout(r, ms));
    async function runFallbackSimulation() {
      actionBtn.hidden = true;
      setStatus('Verificando atualizações...', '', 'indet');
      await wait(1600);
      if (!navigator.onLine) {
        setStatus('Sem conexão', 'Verifique sua internet.', 'err');
        fill.style.width = '100%';
        actionBtn.textContent = 'Tentar novamente';
        actionBtn.hidden = false;
        actionBtn.onclick = runFallbackSimulation;
        return;
      }
      setStatus('Baixando atualização...', '', '');
      let p = 0;
      setProgress(0, '0 / 29,8 MB');
      await new Promise(res => {
        const timer = setInterval(() => {
          p = Math.min(100, p + (p < 70 ? 2.5 + Math.random() * 2 : 1 + Math.random() * 1.5));
          const mb = (29.8 * p / 100).toFixed(1).replace('.', ',');
          setProgress(p, `${mb} / 29,8 MB`);
          if (p >= 100) { clearInterval(timer); res(); }
        }, 120);
      });
      await wait(400);
      setStatus('Instalando...', '', 'indet');
      await wait(1800);
      setStatus('Tudo pronto!', 'Atualizado com sucesso.', 'done');
      fill.style.width = '100%';
      track.setAttribute('aria-valuenow', 100);
      actionBtn.textContent = 'Abrir Alura';
      actionBtn.hidden = false;
    }
    runFallbackSimulation();
  }
</script>
</body>
</html>
