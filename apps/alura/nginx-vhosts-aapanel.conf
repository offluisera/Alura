# ==============================================================================
# CONFIGURAÇÃO NGINX PARA AAPANEL (Alura API & WebSockets)
# Local no VPS: No aaPanel, adicione os sites ou configure em:
# /www/server/panel/vhost/nginx/api.alura.net.br.conf
# /www/server/panel/vhost/nginx/ws.alura.net.br.conf
# ==============================================================================

# ──────────────────────────────────────────────────────────────────────────────
# 1. VHOST: api.alura.net.br (API REST Phoenix & Health Check)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl http2;
    server_name api.alura.net.br;

    # Certificados SSL gerenciados pelo aaPanel (ou Cloudflare Origin CA)
    # ssl_certificate /www/server/panel/vhost/cert/api.alura.net.br/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/api.alura.net.br/privkey.pem;

    # Otimização de buffers e timeouts
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Headers de encaminhamento para o Phoenix
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts HTTP normais
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ──────────────────────────────────────────────────────────────────────────────
# 2. VHOST: ws.alura.net.br (Phoenix Channels & WebSockets)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl http2;
    server_name ws.alura.net.br;

    # Certificados SSL gerenciados pelo aaPanel (ou Cloudflare Origin CA)
    # ssl_certificate /www/server/panel/vhost/cert/ws.alura.net.br/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/ws.alura.net.br/privkey.pem;

    # Endpoint WebSocket nativo do Phoenix (/socket/websocket)
    location /socket {
        proxy_pass http://127.0.0.1:4000/socket;
        proxy_http_version 1.1;

        # Headers obrigatórios para handshake de Upgrade WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts longos: essencial para WebSockets NÃO caírem a cada 60s
        proxy_connect_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Desativa buffering para mensagens chegarem com latência zero (< 15ms)
        proxy_buffering off;
    }

    # Fallback para rotas gerais no mesmo domínio
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
